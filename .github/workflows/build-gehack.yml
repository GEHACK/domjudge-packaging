name: "Build GEHACK DOMjudge containers"

# Our judgehost image differs from upstream only in that it can judge in the Nix chroot
# genix mounts over /chroot/domjudge, so the judge runs the contest workstations'
# toolchain. The domserver is upstream's, built from the same commit so both always match.
# See GEHACK.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (must match the tag pinned in genix)"
        required: true
        default: "bleeding-gehack.2"
      domjudge_ref:
        description: "DOMjudge branch, tag or commit to build"
        required: true
        default: "main"

jobs:
  build:
    if: ${{ github.repository == 'GEHACK/domjudge-packaging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/gehack
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch DOMjudge source
        env:
          DOMJUDGE_REF: ${{ inputs.domjudge_ref }}
        run: |
          set -eux
          cd docker
          git init --quiet domjudge
          git -C domjudge fetch --quiet --depth 1 https://github.com/DOMjudge/domjudge.git "$DOMJUDGE_REF"
          git -C domjudge checkout --quiet FETCH_HEAD
          echo "DOMJUDGE_COMMIT=$(git -C domjudge rev-parse HEAD)" >> "$GITHUB_ENV"
          # The .git directory stays in so configure stamps the commit into the version.
          tar czf domjudge.tar.gz domjudge
          rm -rf domjudge

      - name: Build the domserver container
        run: |
          cd docker
          ./build-domserver.sh "$REGISTRY/domserver:$TAG"

      - name: Build the judgehost container
        run: |
          cd docker
          # build-judgehost.sh runs the chroot stage with --privileged, which it needs to
          # mount /proc; GitHub-hosted runners allow that.
          ./build-judgehost.sh "$REGISTRY/judgehost:$TAG"

      - name: Push and report the digests to pin
        run: |
          set -eu
          for image in domserver judgehost; do
            docker push "$REGISTRY/$image:$TAG"
          done
          digest() { docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/$1:$TAG" | cut -d@ -f2; }
          {
            echo "Built from DOMjudge commit \`$DOMJUDGE_COMMIT\`."
            echo
            echo '## Pin this in `genix` `modules/judgehost/judgedaemon.nix`'
            echo
            echo '```nix'
            echo "  version = \"$TAG\";"
            echo "    imageDigest = \"$(digest judgehost)\";"
            echo '```'
            echo
            echo 'Get the matching `hash` with:'
            echo
            echo '```'
            echo "nix-prefetch-docker --image-name $REGISTRY/judgehost --image-tag $TAG --arch amd64 --os linux"
            echo '```'
            echo
            echo '## Run the matching domserver'
            echo
            echo '```'
            echo "$REGISTRY/domserver:$TAG@$(digest domserver)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
