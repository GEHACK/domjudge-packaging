name: "Build GEHACK judgehost container"

# Our judgehost image differs from upstream only in docker/judgehost/chroot-and-tar.sh,
# which bootstraps the judging chroot on Ubuntu 26.04 so its toolchain matches the
# contest workstations. See GEHACK.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (must match the tag pinned in genix)"
        required: true
        default: "bleeding-gehack.1"
      domjudge_url:
        description: "DOMjudge source tarball; must be the same version the domserver runs"
        required: false
        default: ""

jobs:
  build-judgehost:
    if: ${{ github.repository == 'GEHACK/domjudge-packaging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/gehack/judgehost
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the judgehost container
        run: |
          set -eux
          url='${{ inputs.domjudge_url }}'
          if [ -z "$url" ]; then
            url="https://www.domjudge.org/snapshot/domjudge-snapshot-$(date '+%Y%m%d').tar.gz"
          fi
          cd docker
          wget --quiet "$url" -O domjudge.tar.gz
          # build-judgehost.sh runs the chroot stage with --privileged, which it needs to
          # mount /proc; GitHub-hosted runners allow that.
          ./build-judgehost.sh "$IMAGE:$TAG"

      - name: Push and report the digest to pin
        run: |
          set -eu
          docker push "$IMAGE:$TAG"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
          {
            echo '## Pin this in `genix` `modules/judgehost/judgedaemon.nix`'
            echo
            echo '```nix'
            echo "  version = \"$TAG\";"
            echo "    imageDigest = \"$digest\";"
            echo '```'
            echo
            echo 'Get the matching `hash` with:'
            echo
            echo '```'
            echo "nix-prefetch-docker --image-name $IMAGE --image-tag $TAG --arch amd64 --os linux"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
